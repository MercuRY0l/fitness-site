<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренировки | FitHard</title>
<link rel="stylesheet" href="/static/css/all_workouts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>
  
  <div class="toast-container" id="toast-container"></div>


<header>
  <div class="logo">FitHard</div>
  <nav>
    <ul>
      <li><a href="/">Главная</a></li>
      <li class="dropdown">
        <a href="#">Тренировки</a>
      <ul class="submenu">
        <li><a href="/all_workouts">Все тренировки</a></li>
        </ul>
      </li>

      <li><a href="#">Личный кабинет</a></li>
    </ul>
  </nav>
</header>

<main>


<h1>Мои тренировки</h1>

<div id="workoutList" class="workout-list">
  <h2>Здесь пока пусто.</h2>
</div>


<div class="exerciseContainer" id="exerciseContainer">
  <h2>Выберите упражнение</h2>

  <div class="search-container">
    <input id="searchInput" type="text" placeholder="Введите название упражнения, например: жим лежа" class="search-box">
    <button id="searchWorkout" class="search-btn" type="submit">Искать</button>
    <div class="search-results" id="search-results"></div>
  </div>

  <input class="workout-sets" id="workout-sets" placeholder="Введите количество подходов, например: 5"></input>
  <input class="workout-reps" id="workout-reps" placeholder="Введите количество повторений, например: 10"></input>

</div>



</div>


</main>
